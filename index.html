<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Argaw Auto | Premium Pre-Owned Vehicles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow-x: hidden; font-family: 'Helvetica Neue', Arial, sans-serif; background: #0a0a0a; color: #fff; }

  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .bg-video {
    position: absolute;
    top: 50%; left: 50%;
    min-width: 100%; min-height: 100%;
    width: auto; height: auto;
    transform: translate(-50%, -50%);
    z-index: -2;
    object-fit: cover;
  }

  .overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.75) 100%);
    z-index: -1;
  }

  .content {
    max-width: 900px;
    padding: 40px 20px;
    animation: fadeUp 1.4s ease forwards;
  }

  .badge {
    display: inline-block;
    padding: 8px 18px;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 999px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(8px);
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  h1 {
    font-size: clamp(2.6rem, 6vw, 5rem);
    font-weight: 700;
    letter-spacing: -1px;
    line-height: 1.05;
    margin-bottom: 20px;
    background: linear-gradient(180deg, #ffffff 0%, #b8b8b8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  p.tagline {
    font-size: clamp(1rem, 1.5vw, 1.25rem);
    color: rgba(255,255,255,0.78);
    margin-bottom: 40px;
    line-height: 1.6;
  }

  .cta {
    display: inline-block;
    padding: 16px 44px;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #fff;
    text-decoration: none;
    background: linear-gradient(135deg, #00b4ff, #0066ff);
    border-radius: 999px;
    box-shadow: 0 0 24px rgba(0, 180, 255, 0.55), 0 0 60px rgba(0, 102, 255, 0.35);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .cta:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 0 32px rgba(0, 180, 255, 0.85), 0 0 90px rgba(0, 102, 255, 0.55);
  }

  .scroll-hint {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.5);
    animation: bob 2s ease-in-out infinite;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes bob {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(8px); }
  }
</style>
</head>
<body>

<section class="hero">
  <video class="bg-video" autoplay muted loop playsinline>
    <source src="video.mp4" type="video/mp4" />
  </video>
  <div class="overlay"></div>

  <div class="content">
    <div class="badge">Seattle, WA</div>
    <h1>Premium Pre-Owned, Driven Differently.</h1>
    <p class="tagline">Hand-selected vehicles. Transparent history. Built on trust, delivered in Seattle and beyond.</p>
    <a href="content.html" class="cta">View Our Inventory</a>
  </div>

  <div class="scroll-hint">EXPLORE</div>
</section>

</body>
</html>
